[tox]
envlist =
    py{311,312}-django42
    py{311,312,313}-django{51,52}
isolated_build = true

[testenv]
extras = dev
deps =
    django42: Django>=4.2,<4.3
    django51: Django>=5.1,<5.2
    django52: Django>=5.2,<5.3
commands = pytest {posargs}

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
